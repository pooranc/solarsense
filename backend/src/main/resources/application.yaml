spring:
  application:
    name: solarsense
  datasource:
    url: jdbc:h2:mem:solarsensedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jps:
    hibernate:
      ddl-auto: create-drop
    show-swl: true
  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.type: TRACE
      org.hibernate: DEBUG

    
